<svg width="100%" viewBox="0 0 680 555" role="img" xmlns="http://www.w3.org/2000/svg" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
<title>Enterprise Architecture der Kreditanbahnung mit ELA Kredit</title>
<desc>Die Kanäle der Bank rufen über eine gemeinsame API-Grenze denselben standardisierten Anbahnungsprozess und dasselbe zentrale Backend auf. Die Bestandssysteme der Bank sind bidirektional angebunden und werden nicht ersetzt. Die zentrale Governance nach SBVg und FINMA spannt sich über alle Schichten.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- ── Governance-Band über alle Schichten ───────────────────────────── -->
<rect x="608" y="20" width="52" height="510" rx="6" fill="rgb(245, 244, 237)" stroke="rgba(31, 30, 29, 0.30)" stroke-width="1"/>
<g transform="translate(634, 275) rotate(-90)">
  <text x="0" y="-3" text-anchor="middle" font-size="13" font-weight="500" fill="rgb(20, 20, 19)">Zentrale Governance</text>
  <text x="0" y="13" text-anchor="middle" font-size="11" fill="rgb(61, 61, 58)">ein Regelwerk: SBVg / FINMA</text>
</g>

<!-- ── Kanäle der Bank ──────────────────────────────────────────────── -->
<text x="20" y="32" font-size="14" font-weight="500" fill="rgb(20, 20, 19)">Kanäle der Bank</text>
<line x1="20" y1="40" x2="590" y2="40" stroke="rgba(31, 30, 29, 0.15)" stroke-width="0.5"/>

<rect x="20" y="52" width="132" height="52" rx="6" fill="rgb(245, 244, 237)" stroke="rgba(31, 30, 29, 0.35)" stroke-width="0.5"/>
<text x="86" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="rgb(20, 20, 19)">Filiale</text>
<text x="86" y="93" text-anchor="middle" font-size="11" fill="rgb(61, 61, 58)">Beratung vor Ort</text>

<rect x="166" y="52" width="132" height="52" rx="6" fill="rgb(245, 244, 237)" stroke="rgba(31, 30, 29, 0.35)" stroke-width="0.5"/>
<text x="232" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="rgb(20, 20, 19)">Beraterarbeitsplatz</text>
<text x="232" y="93" text-anchor="middle" font-size="11" fill="rgb(61, 61, 58)">geführter Prozess</text>

<rect x="312" y="52" width="132" height="52" rx="6" fill="rgb(245, 244, 237)" stroke="rgba(31, 30, 29, 0.35)" stroke-width="0.5"/>
<text x="378" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="rgb(20, 20, 19)">Online-Portal</text>
<text x="378" y="93" text-anchor="middle" font-size="11" fill="rgb(61, 61, 58)">Self-Service</text>

<rect x="458" y="52" width="132" height="52" rx="6" fill="rgb(245, 244, 237)" stroke="rgba(31, 30, 29, 0.35)" stroke-width="0.5"/>
<text x="524" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="rgb(20, 20, 19)">Weitere Kanäle</text>
<text x="524" y="93" text-anchor="middle" font-size="11" fill="rgb(61, 61, 58)">digitale Touchpoints</text>

<!-- Fan-in: alle Kanäle treffen an derselben Stelle auf -->
<line x1="86" y1="104" x2="305" y2="152" stroke="rgb(115, 114, 108)" stroke-width="1.2"/>
<line x1="232" y1="104" x2="305" y2="152" stroke="rgb(115, 114, 108)" stroke-width="1.2"/>
<line x1="378" y1="104" x2="305" y2="152" stroke="rgb(115, 114, 108)" stroke-width="1.2"/>
<line x1="524" y1="104" x2="305" y2="152" stroke="rgb(115, 114, 108)" stroke-width="1.2"/>

<!-- ── API-Grenze ───────────────────────────────────────────────────── -->
<line x1="20" y1="152" x2="590" y2="152" stroke="rgb(24, 95, 165)" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="20" y="146" font-size="12" font-weight="500" fill="rgb(24, 95, 165)">API-Grenze</text>
<text x="20" y="171" font-size="11" fill="rgb(115, 114, 108)">dieselbe Schnittstelle für alle Kanäle</text>
<line x1="305" y1="152" x2="305" y2="180" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

<!-- ── ELA Kredit ───────────────────────────────────────────────────── -->
<rect x="20" y="180" width="570" height="222" rx="8" fill="none" stroke="rgb(24, 95, 165)" stroke-width="1"/>
<text x="32" y="200" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">ELA Kredit</text>

<rect x="36" y="212" width="538" height="94" rx="6" fill="rgba(250, 238, 218, 0.45)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
<text x="46" y="231" font-size="12" font-weight="500" fill="rgb(99, 56, 6)">Standardisierter Anbahnungsprozess</text>
<text x="564" y="231" text-anchor="end" font-size="11" font-style="italic" fill="rgb(133, 79, 11)">Standardisierungsachse</text>

<rect x="44" y="242" width="120" height="52" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
<text x="104" y="266" text-anchor="middle" font-size="13" font-weight="500" fill="rgb(99, 56, 6)">Beratung</text>
<text x="104" y="283" text-anchor="middle" font-size="11" fill="rgb(133, 79, 11)">Bedarf und Angebot</text>
<line x1="165" y1="268" x2="177" y2="268" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

<rect x="178" y="242" width="120" height="52" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
<text x="238" y="266" text-anchor="middle" font-size="13" font-weight="500" fill="rgb(99, 56, 6)">Antrag</text>
<text x="238" y="283" text-anchor="middle" font-size="11" fill="rgb(133, 79, 11)">Datenerfassung</text>
<line x1="299" y1="268" x2="311" y2="268" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

<rect x="312" y="242" width="120" height="52" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
<text x="372" y="266" text-anchor="middle" font-size="13" font-weight="500" fill="rgb(99, 56, 6)">Vorprüfung</text>
<text x="372" y="283" text-anchor="middle" font-size="11" fill="rgb(133, 79, 11)">Scoring, KYC</text>
<line x1="433" y1="268" x2="445" y2="268" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

<rect x="446" y="242" width="120" height="52" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
<text x="506" y="261" text-anchor="middle" font-size="13" font-weight="500" fill="rgb(99, 56, 6)">Entscheid-</text>
<text x="506" y="275" text-anchor="middle" font-size="13" font-weight="500" fill="rgb(99, 56, 6)">vorbereitung</text>
<text x="506" y="289" text-anchor="middle" font-size="11" fill="rgb(133, 79, 11)">Dossier</text>

<line x1="305" y1="306" x2="305" y2="326" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" fill="none"/>
<text x="316" y="320" font-size="11" fill="rgb(115, 114, 108)">liest / schreibt</text>

<rect x="36" y="326" width="538" height="64" rx="6" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)" stroke-width="0.5"/>
<text x="305" y="352" text-anchor="middle" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">Zentrales Backend — Single Source of Truth</text>
<text x="305" y="372" text-anchor="middle" font-size="11" fill="rgb(24, 95, 165)">Integrationsachse: ein Fall, ein Datenkern, aus jedem Kanal dieselbe Sicht</text>

<!-- ── Bestandssysteme der Bank ─────────────────────────────────────── -->
<line x1="305" y1="402" x2="305" y2="434" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" fill="none"/>
<text x="316" y="415" font-size="11" fill="rgb(115, 114, 108)">Abfragen und Rückmeldungen</text>
<text x="316" y="429" font-size="11" fill="rgb(115, 114, 108)">einmal angebunden, systemweit genutzt</text>

<rect x="20" y="434" width="570" height="96" rx="8" fill="none" stroke="rgb(59, 109, 17)" stroke-width="1"/>
<text x="32" y="454" font-size="12" font-weight="500" fill="rgb(39, 80, 10)">Bestandssysteme der Bank — angebunden, nicht ersetzt</text>

<rect x="37" y="466" width="122" height="54" rx="6" fill="rgb(234, 243, 222)" stroke="rgb(59, 109, 17)" stroke-width="0.5"/>
<text x="98" y="489" text-anchor="middle" font-size="13" font-weight="500" fill="rgb(39, 80, 10)">Kernbanksystem</text>
<text x="98" y="506" text-anchor="middle" font-size="11" fill="rgb(59, 109, 17)">Finnova, Avaloq</text>

<rect x="175" y="466" width="122" height="54" rx="6" fill="rgb(234, 243, 222)" stroke="rgb(59, 109, 17)" stroke-width="0.5"/>
<text x="236" y="489" text-anchor="middle" font-size="13" font-weight="500" fill="rgb(39, 80, 10)">Auskunfteien</text>
<text x="236" y="506" text-anchor="middle" font-size="11" fill="rgb(59, 109, 17)">CRIF, ZEK</text>

<rect x="313" y="466" width="122" height="54" rx="6" fill="rgb(234, 243, 222)" stroke="rgb(59, 109, 17)" stroke-width="0.5"/>
<text x="374" y="489" text-anchor="middle" font-size="13" font-weight="500" fill="rgb(39, 80, 10)">Bewertungsdaten</text>
<text x="374" y="506" text-anchor="middle" font-size="11" fill="rgb(59, 109, 17)">IAZI, Terravis</text>

<rect x="451" y="466" width="122" height="54" rx="6" fill="rgb(234, 243, 222)" stroke="rgb(59, 109, 17)" stroke-width="0.5"/>
<text x="512" y="489" text-anchor="middle" font-size="13" font-weight="500" fill="rgb(39, 80, 10)">DMS / Archiv</text>
<text x="512" y="506" text-anchor="middle" font-size="11" fill="rgb(59, 109, 17)">Dokumente</text>
</svg>
