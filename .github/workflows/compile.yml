name: Compile Typst Document

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Compile PDF Artifact
        run: typst compile main.typ output_document.pdf

      - name: Upload Production PDF
        uses: actions/upload-artifact@v7
        with:
          name: compiled-paper
          path: output_document.pdf
